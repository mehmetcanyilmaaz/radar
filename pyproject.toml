[project]
name = "radar"
version = "0.1.0"
description = "Capability radar: log and compare AI model probe runs"
requires-python = ">=3.12"
dependencies = []

# This is what makes `uv run radar ...` work: the command name maps to
# the main() function in src/radar/cli.py
[project.scripts]
radar = "radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8",
    "ruff>=0.6",
]
